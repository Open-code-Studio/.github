name: Daily Summary - All Repositories (Single Message)

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

jobs:
  collect-data:
    runs-on: ubuntu-latest
    outputs:
      report: ${{ steps.collect.outputs.report }}
    steps:
      - name: 遍历所有仓库收集活动
        id: collect
        run: |
          REPORT="📊 **OCS 每日汇总报告**\n📅 日期： $(date -u +%Y-%m-%d)\n\n"
          
          # 获取所有仓库列表
          REPOS=$(curl -s -H "Authorization: token ${{ github.token }}" \
            "https://api.github.com/orgs/Open-code-Studio/repos?per_page=100&type=public" | jq -r '.[].name')
          
          TOTAL_COMMITS=0
          TOTAL_PRS=0
          TOTAL_ISSUES=0
          HAS_ANY=false
          
          for REPO in $REPOS; do
            FULL_NAME="Open-code-Studio/$REPO"
            TODAY=$(date -u +%Y-%m-%d)
            
            # 克隆获取提交
            git clone --depth 1 "https://github.com/$FULL_NAME.git" repo 2>/dev/null || continue
            cd repo
            COMMITS=$(git log --since="$TODAY" --oneline --no-merges 2>/dev/null | wc -l | tr -d ' ')
            cd ..
            rm -rf repo
            
            if [ -z "$COMMITS" ]; then
              COMMITS=0
            fi
            
            # 通过 API 获取统计
            PRS=$(curl -s -H "Authorization: token ${{ github.token }}" \
              "https://api.github.com/repos/$FULL_NAME/pulls?state=all&since=${TODAY}T00:00:00Z" | jq length)
            
            ISSUES=$(curl -s -H "Authorization: token ${{ github.token }}" \
              "https://api.github.com/repos/$FULL_NAME/issues?state=all&since=${TODAY}T00:00:00Z" | jq length)
            
            TOTAL=$((COMMITS + PRS + ISSUES))
            if [ $TOTAL -gt 0 ]; then
              HAS_ANY=true
              REPORT="${REPORT}• **$REPO**： ✨$COMMITS  🔀$PRS  🐛$ISSUES\n"
              TOTAL_COMMITS=$((TOTAL_COMMITS + COMMITS))
              TOTAL_PRS=$((TOTAL_PRS + PRS))
              TOTAL_ISSUES=$((TOTAL_ISSUES + ISSUES))
            fi
          done
          
          # 如果没有活动，直接输出空
          if [ "$HAS_ANY" = false ]; then
            REPORT="📊 **OCS 每日汇总报告**\n📅 日期： $(date -u +%Y-%m-%d)\n\n💤 今天所有仓库均无新活动。"
          fi
          
          # 添加总统计
          REPORT="${REPORT}\n**总计**： ✨$TOTAL_COMMITS  🔀$TOTAL_PRS  🐛$TOTAL_ISSUES"
          
          # 转义换行和特殊字符，以便在 GitHub Output 中使用
          echo "report<<EOF" >> $GITHUB_OUTPUT
          echo -e "$REPORT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

  notify-discord:
    needs: collect-data
    runs-on: ubuntu-latest
    steps:
      - name: 发送合并报告到 Discord
        uses: Ilshidur/action-discord@0.4.0
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        with:
          args: |
            ${{ needs.collect-data.outputs.report }}
